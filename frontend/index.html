<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Root-relative on purpose (issue #151). This document is served for
         every SPA route by the catch-all in backend/main.py, so a
         document-relative href makes a nested route request e.g.
         /entra/site.webmanifest — which the same catch-all answers with
         index.html at HTTP 200. The install then reads HTML as its manifest
         and silently falls back to derived defaults. -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_APP_TITLE%</title>
    <!--
      Synchronous theme bootstrap (issue #85, updated for #129).

      The script lives in `public/theme-bootstrap.js` and is loaded
      here via `<script src="...">` — the SPA's CSP is
      `script-src 'self'` (no `'unsafe-inline'`, no nonce, no
      `sha256-…` hash; issue #98), so an inline `<script>` would be
      silently blocked at runtime. External scripts served from the
      same origin are allowed by `'self'`, which is why option 2 of
      the issue's fix menu (move the inline script to an external
      file) keeps CSP clean and avoids the per-script hash bookkeeping
      option 1 would require.

      The tag MUST stay in `<head>` without `defer` / `async` so the
      browser blocks parsing, fetches the script, and executes it
      synchronously before `<body>` is parsed — the very first paint
      then already carries the correct Bootstrap 5.3 theme
      (`data-bs-theme` cascades from <html> to navbar, cards, forms,
      and dropdowns). The script's resolution order mirrors
      `src/theme/ThemeProvider.jsx`:
        1. localStorage["theme-mode"] if it is 'light' or 'dark'.
        2. localStorage["theme-mode"] === 'os' — follow
           prefers-color-scheme (fall back to dark if matchMedia
           is unavailable).
        3. No stored value — 'dark' is the safe default (#129); OS
           preference does NOT participate unless the user opts into
           'os' mode in Settings.

      React-side `ThemeProvider` does the same assignment on mount
      (defence in depth — keeps the dark theme stable if the boot
      script ever fails to load).
    -->
    <script src="/theme-bootstrap.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
