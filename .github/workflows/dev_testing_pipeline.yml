name: Development Testing

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

jobs:
  # Plan the dev infrastructure so PRs surface OpenTofu changes before merge.
  # This is read-only: it never applies. The deploy pipelines only run on a
  # merged PR, so without this nothing exercised tofu until it was too late.
  #
  # `environment: dev` is required, not cosmetic -- the deploy identity's
  # federated credential is scoped to the subject
  # repo:kstrassheim/ultimate-web-stack:environment:dev, and OIDC login fails
  # without a matching subject.
  tofu-plan:
    name: OpenTofu Plan
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6

      - name: Log in to Azure via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set environment variables for OpenTofu
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          # Two consumers, two mechanisms, both required:
          #   ARM_USE_OIDC / ARM_USE_CLI  -> azurerm backend and provider
          #   TF_VAR_*                    -> azure_vault key provider (block args only)
          # Drop either and that consumer falls back to AzureCLICredential, which
          # fails: "Please specify only one of subscription and tenant, not both".
          echo "ARM_USE_OIDC=true" >> $GITHUB_ENV
          echo "ARM_USE_CLI=false" >> $GITHUB_ENV
          echo "TF_VAR_use_oidc=true" >> $GITHUB_ENV
          echo "TF_VAR_arm_client_id=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_arm_tenant_id=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_env=dev" >> $GITHUB_ENV

      - name: OpenTofu Init
        run: tofu init

      - name: OpenTofu Validate
        run: tofu validate

      - name: OpenTofu Plan
        run: tofu plan -out=tfplan

      - name: Plan summary
        if: always()
        run: |
          echo "## OpenTofu Plan Summary (dev)" >> $GITHUB_STEP_SUMMARY
          tofu show --json tfplan 2>/dev/null | \
            jq -r '.resource_changes[]? | select(.change.actions != ["no-op"]) |
                   "- `\(.change.actions | join(","))` \(.address)"' \
            >> $GITHUB_STEP_SUMMARY || echo "(no parseable plan)" >> $GITHUB_STEP_SUMMARY

  # Add CodeQL Analysis job
  codeql-analysis:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Required for uploading CodeQL results
      actions: read
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      # Initialize CodeQL analysis
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python, javascript  # Analyze both backend and frontend
          queries: security-extended  # Use extended security queries
      
      # Autobuild (attempts to build code for languages that require it)
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      
      # Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python,javascript"

  # New job for backend pytest tests
  backend-unit-tests:
    runs-on: ubuntu-latest
    container: python:3.12-alpine
    # Cache-key versioning lives in the env block so bumping the Python or
    # image version is a one-line change that also invalidates the cache
    # (see the actions/cache steps below).
    env:
      PYTHON_VERSION: '3.12'
      IMAGE_TAG: 'python-3.12-alpine'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Persist Alpine's downloaded .apk files (gcc, musl-dev, linux-headers
      # below) between runs so every PR is not re-fetching the wheel-build
      # toolchain from scratch. Requires `--no-cache` to be dropped from
      # `apk add` below so the .apk files actually land in /var/cache/apk.
      # Keying on /etc/alpine-release means a base-image bump invalidates
      # the cache instead of serving stale packages.
      - name: Cache Alpine packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apk
          key: ${{ env.IMAGE_TAG }}-apk-${{ hashFiles('/etc/alpine-release') }}
          restore-keys: |
            ${{ env.IMAGE_TAG }}-apk-

      # Cache uv's wheel downloads (XDG_CACHE_HOME default ~/.cache/uv) so
      # `uv pip sync` reuses already-fetched wheels across runs. Keyed on
      # backend/requirements.txt so a lockfile change only invalidates
      # THAT key; the IMAGE_TAG + PYTHON_VERSION prefixes invalidate the
      # cache when the base image or Python version bumps. The fallback
      # restore-keys still hand a partial cache to a brand-new branch, so
      # uv only re-fetches what is actually new.
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ env.IMAGE_TAG }}-py${{ env.PYTHON_VERSION }}-uv-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ env.IMAGE_TAG }}-py${{ env.PYTHON_VERSION }}-uv-

      # Install dependencies (Alpine-specific)
      - name: Install backend dependencies
        run: |
          # Install build dependencies required for some Python packages.
          # `--no-cache` is intentionally dropped so the .apk files land
          # in /var/cache/apk and the Cache Alpine packages step above can
          # persist them across runs.
          apk add gcc musl-dev linux-headers
          # Alpine's pip is not externally-managed (PEP 668), so `pip install uv` is fine.
          pip install --upgrade pip uv
          # backend/requirements.txt is the generated, hashed lock produced by
          #     uv pip compile requirements.in --universal --generate-hashes \
          #         --python-version 3.12 -o requirements.txt
          # (see backend/requirements.in for the hand-edited direct-dependency selector).
          # `uv pip sync` still installs exactly what requirements.txt pins;
          # the Cache uv step above only short-circuits the network fetch --
          # it never relaxes the lockfile contract.
          uv pip sync --system backend/requirements.txt
      
      # Run pytest with coverage
      - name: Run pytest with coverage
        run: |
          cd backend
          pytest --cov=. --cov-report=xml --cov-report=html
      
      # Upload test coverage report as an artifact
      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-coverage
          path: backend/htmlcov
          if-no-files-found: ignore
      
      # Upload coverage XML for potential integration with Codecov or other tools
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore

  # Run Jest tests for frontend components in an official Node.js container
  frontend-unit-tests:
    runs-on: ubuntu-latest
    container: node:22-alpine  # Use the Alpine-based Node.js container
    # Cache-key versioning lives in the env block so bumping the Node or
    # image version is a one-line change that also invalidates the cache
    # (see the actions/cache steps below).
    env:
      NODE_VERSION: '22'
      IMAGE_TAG: 'node-22-alpine'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Persist Alpine's downloaded .apk files (python3, make, g++, git,
      # bash below) between runs. Requires `--no-cache` to be dropped
      # from `apk add` below so the .apk files actually land in
      # /var/cache/apk. Keying on /etc/alpine-release means a base-image
      # bump invalidates the cache instead of serving stale binaries.
      - name: Cache Alpine packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apk
          key: ${{ env.IMAGE_TAG }}-apk-${{ hashFiles('/etc/alpine-release') }}
          restore-keys: |
            ${{ env.IMAGE_TAG }}-apk-

      # Cache npm's downloaded package tarballs so `npm ci` reuses them
      # across runs instead of re-downloading the entire tree on every
      # PR. Keyed on frontend/package-lock.json so a lockfile change
      # invalidates correctly; the IMAGE_TAG + NODE_VERSION prefixes
      # invalidate the cache when the base image or Node major version
      # bumps.
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ env.IMAGE_TAG }}-node${{ env.NODE_VERSION }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ env.IMAGE_TAG }}-node${{ env.NODE_VERSION }}-npm-

      # Install Alpine build dependencies for npm packages that may need compilation.
      # `--no-cache` is intentionally dropped so apk populates /var/cache/apk,
      # which the Cache Alpine packages step above persists across runs.
      - name: Install build dependencies
        run: |
          apk add python3 make g++ git bash

      # Install frontend dependencies with retry logic.
      # `npm ci` still installs exactly what package-lock.json pins;
      # the Cache npm step above only short-circuits the network fetch.
      - name: Install frontend dependencies
        run: |
          cd frontend
          # Configure npm for better reliability
          npm config set fetch-retries 5
          npm config set fetch-retry-maxtimeout 60000
          npm ci || npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Regression gate for production-reachable HIGH+ CVEs.
      # `--omit=dev` matches what ships in the deployed bundle (see
      # issue #122 — @nevware21/ts-utils prototype pollution was
      # previously reachable from appInsights on every page load).
      # Exits non-zero if any high/critical vuln remains.
      - name: Audit production dependencies for HIGH+ vulnerabilities
        run: |
          cd frontend
          npm audit --omit=dev --audit-level=high

      # Run Jest tests
      - name: Run Jest tests
        run: |
          cd frontend
          npm run test:coverage
      
      # Upload test coverage report as an artifact
      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jest-coverage
          path: frontend/coverage/lcov-report
          if-no-files-found: ignore

  e2e-tests:
    #needs: frontend-unit-tests  # Ensure frontend unit tests are completed first
    runs-on: ubuntu-latest
    # Cache-key versioning for the uv cache below. Bumping the Python
    # version here is the same change as in actions/setup-python above
    # and invalidates the cache automatically.
    env:
      PYTHON_VERSION: '3.12'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Set up Node.js directly on the runner. The built-in `cache: npm`
      # + `cache-dependency-path: frontend/package-lock.json` lets the
      # subsequent `npm ci` reuse the downloaded package tarballs across
      # runs. The action's default cache key already includes runner.os
      # + the Node version, so a base or runtime bump invalidates
      # correctly without any extra wiring here.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Set up Python for backend.
      #
      # We do NOT ask setup-python to cache the pip cache folder: this job
      # installs the backend with `uv pip sync` (PEP 668 externally-managed
      # on the Debian image), so /home/runner/.cache/pip is never populated.
      # The `actions/setup-python` post-action then fails with
      # "Cache folder path is retrieved for pip but doesn't exist on disk",
      # which fails the job even though every actual step succeeded. See the
      # Cache uv step below for the uv-specific cache, and the Install
      # backend dependencies step for the uv install command.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Cache uv's wheel downloads (XDG_CACHE_HOME default ~/.cache/uv)
      # so `uv pip sync` reuses already-fetched wheels across runs.
      # Keyed on backend/requirements.txt so a lockfile change only
      # invalidates THAT key; the runner.os + PYTHON_VERSION prefix
      # invalidates the cache when the runner image or Python version
      # bumps. The fallback restore-keys still hand a partial cache to
      # a brand-new branch, so uv only re-fetches what is actually new.
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ubuntu-py${{ env.PYTHON_VERSION }}-uv-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ubuntu-py${{ env.PYTHON_VERSION }}-uv-

      # Install backend dependencies (modified)
      - name: Install backend dependencies
        run: |
          cd backend
          # Install uv via the standalone installer (Debian's system pip is
          # externally-managed under PEP 668, so `pip install uv` is blocked).
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          # backend/requirements.txt is the generated, hashed lock produced by
          #     uv pip compile requirements.in --universal --generate-hashes \
          #         --python-version 3.12 -o requirements.txt
          # (see backend/requirements.in for the hand-edited direct-dependency selector).
          # `uv pip sync` still installs exactly what requirements.txt pins;
          # the Cache uv step above only short-circuits the network fetch.
          uv venv venv --python 3.12
          source venv/bin/activate
          uv pip sync requirements.txt
          # Make sure the virtual env path exists
          python -c "import sys; print(sys.executable)" > python_path.txt
          cat python_path.txt
      
      # Install frontend dependencies with retry logic
      - name: Install frontend dependencies
        run: |
          cd frontend
          # Configure npm for better reliability
          npm config set fetch-retries 5
          npm config set fetch-retry-maxtimeout 60000
          npm ci || npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Install Cypress browser dependencies
      - name: Install browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk2.0-0 \
            libgtk-3-0 \
            libgbm-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libasound2-dev \
            libxtst6 \
            xauth \
            xvfb \
            fonts-liberation \
            libappindicator3-1 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdbus-1-3 \
            libnspr4 \
            libu2f-udev \
            libvulkan1
      
      - name: Run E2E Tests
        run: |
          cd frontend
          # Run the tests first
          npm run test:e2e:coverage
          
          # Create .nyc_output directory if it doesn't exist
          mkdir -p .nyc_output
          
          # Check if there are coverage files
          if [ "$(find .nyc_output -name '*.json' | wc -l)" -eq 0 ]; then
            echo "Warning: No coverage files generated. Creating a placeholder to prevent pipeline failure."
            echo '{}' > .nyc_output/coverage-placeholder.json
          fi
          
          # generate coverage reports
          npm run coverage:report:no-check

          # Run coverage check
          npm run check-coverage

      # Upload Cypress screenshots on failure
      - name: Upload screenshots if tests fail
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore
      
      # Upload Cypress videos
      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-videos
          path: frontend/cypress/videos
          if-no-files-found: ignore
      
      # Upload flattened coverage reports
      - name: Upload E2E coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-coverage-report
          path: frontend/coverage/lcov-report
          if-no-files-found: warn

