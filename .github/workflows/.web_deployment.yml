# Reusable Web App Deployment
#
# This workflow deploys an Entra ID authenticated web application to Azure.
#
# USAGE:
# ------
# jobs:
#   deploy:
#     uses: ./.github/workflows/entraid_web_deployment.yml
#     with:
#       environment: 'dev'
#       python_version: '3.12'
#       node_version: '18'
#     secrets:
#       AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
#       AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
#       AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
#
# PREREQUISITES:
# -------------
# 1. Azure credentials configured as repository secrets
# 2. Repository structure:
#    - [backend]: FastAPI backend code
#    - [frontend]: React frontend code
#    - OpenTofu configuration in the repository root
#
name: Reusable Web App Deployment
on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (dev, test, prod)'
        required: false
        type: string
        default: 'dev'
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.12'
      node_version:
        description: 'Node.js version'
        required: false
        type: string
        default: '22'
      working_dir:
        description: 'Directory with OpenTofu files'
        required: false
        type: string
        default: '.'
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

jobs:
  deploy:
    environment:
      # WILL REQUEST APPROVAL ONLY ONCE
      name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # === OPENTOFU STEPS ===
      - name: Checkout repository
        uses: actions/checkout@v5
        
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
        
      - name: Log in to Azure via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
      - name: Set environment variables for OpenTofu
        run: |
          # ARM_FEDERATED_TOKEN_FILE was removed: nothing in this workflow ever
          # wrote that file, and leaving it set steers the OIDC path at a
          # non-existent token instead of the runner's request endpoint.
          #
          # Two consumers, two mechanisms, both required:
          #   ARM_USE_OIDC / ARM_USE_CLI  -> azurerm backend and provider
          #   TF_VAR_*                    -> azure_vault key provider, which does
          #                                  NOT read ARM_* and takes block args only
          # Drop either and that consumer falls back to AzureCLICredential, which
          # fails: "Please specify only one of subscription and tenant, not both".
          echo "ARM_USE_OIDC=true" >> $GITHUB_ENV
          echo "ARM_USE_CLI=false" >> $GITHUB_ENV
          echo "TF_VAR_use_oidc=true" >> $GITHUB_ENV
          echo "TF_VAR_arm_client_id=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_arm_tenant_id=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_env=${{ inputs.environment }}" >> $GITHUB_ENV

      - name: OpenTofu Init
        working-directory: ${{ inputs.working_dir }}
        run: | 
          # container_name and key come from var.app_name / var.env in
          # backend.tf; TF_VAR_env is set above from the environment input.
          tofu init

      - name: OpenTofu Apply
        working-directory: ${{ inputs.working_dir }}
        run: |
          if [ "${{ inputs.environment }}" != "dev" ]; then
            TFVARS_FILE="vars_${{ inputs.environment }}.tfvars"
            echo "Checking for environment-specific tfvars file: $TFVARS_FILE"
            
            if [ ! -f "$TFVARS_FILE" ]; then
              echo "::error::Missing required file: $TFVARS_FILE"
              echo "Please create a tofu variables file for environment '${{ inputs.environment }}'"
              exit 1
            fi
            
            echo "Using environment-specific tfvars file: $TFVARS_FILE"
            tofu apply -auto-approve -var-file="$TFVARS_FILE"
          else
            echo "Using default variables (dev environment)"
            tofu apply -auto-approve
          fi

          tofu output -json > output.json

          echo "Validating JSON..."
          if jq . output.json > /dev/null 2>&1; then
            echo -e "\033[32mSUCCESS: Valid JSON confirmed\033[0m"
          else
            echo -e "\033[31mERROR: Invalid JSON generated by tofu output\033[0m"
            cat output.json
            exit 1
          fi
          
      # Upload tofu output as artifact  
      - name: Upload OpenTofu output artifact
        uses: actions/upload-artifact@v6
        with:
          name: tofu-config-${{ inputs.environment }}
          path: ${{ inputs.working_dir }}/output.json
          retention-days: 7
          if-no-files-found: error
      
      # === BUILD STEPS ===
      - name: Copy and format OpenTofu config
        run: |
          if [ -f "${{ inputs.working_dir }}/output.json" ]; then
            cp ${{ inputs.working_dir }}/output.json backend/terraform.config.json
            cp ${{ inputs.working_dir }}/output.json frontend/terraform.config.json
          else
            echo "Error: output.json not found!"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          registry-url: 'https://registry.npmjs.org/'
          
      - name: Install backend dependencies with uv
        run: |
          cd backend
          # Install uv via the standalone installer (Debian's system pip is
          # externally-managed under PEP 668, so `pip install uv` is blocked).
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          # backend/requirements.txt is the generated, hashed lock produced by
          #     uv pip compile requirements.in --universal --generate-hashes \
          #         --python-version 3.12 -o requirements.txt
          # (see backend/requirements.in for the hand-edited direct-dependency selector).
          uv venv venv --python ${{ inputs.python_version }}
          source venv/bin/activate
          uv pip sync requirements.txt
          
      # Install frontend dependencies with retry logic
      - name: Install frontend dependencies
        run: |
          cd frontend
          # Create a .deploy file to Mark vite.config to use live urls for build
          touch .deploy
          # Configure npm for better reliability
          npm config set fetch-retries 5
          npm config set fetch-retry-maxtimeout 60000
          npm ci || npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Zip artifact for deployment
        run: |
          cd backend
          zip -r ../release.zip ./* -x "*/mock/*" -x "mock/*" -x "*/__pycache__/*" -x "*_test.py" -x "tests/*" 
          
      # Upload release package as artifact
      - name: Upload Release package artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-package-${{ inputs.environment }}
          path: release.zip
          retention-days: 7
          if-no-files-found: error
      
      # === DEPLOY STEPS ===
      - name: Extract web app name from OpenTofu config
        id: extract-app-name
        run: |
          APP_NAME=$(jq -r '.web_app_name.value' ${{ inputs.working_dir }}/output.json)
          echo "web_app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "Using web app name: $APP_NAME"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: ${{ steps.extract-app-name.outputs.web_app_name }}
          package: release.zip
          slot-name: 'Production'
      
      - name: Logout from Azure
        if: always()
        run: |
          az logout
          # Clean up any cached credentials
          rm -rf ~/.azure 2>/dev/null || true